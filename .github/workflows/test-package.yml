name: "TESTY | paczka"

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: "PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, DBAL ${{ matrix.dbal }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.2", symfony: "^6.4", dbal: "^3.8" }
          - { php: "8.3", symfony: "^7.4", dbal: "^4" }
          - { php: "8.4", symfony: "^7.4", dbal: "^4" }
    # vulqen/php-sdk jest prywatnym repozytorium VCS. COMPOSER_AUTH to
    # {"github-oauth": {"github.com": "<token z odczytem DeveloperLancer/vulqen-sdk-php>"}}.
    env:
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, curl, iconv, mbstring, pdo_sqlite, zlib
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifest
        run: composer validate --strict --no-check-publish

      - name: Reject path repositories
        run: php bin/guard-no-path-repo

      - name: Pin Symfony and DBAL
        run: |
          composer require --no-update \
            "symfony/config:${{ matrix.symfony }}" \
            "symfony/dependency-injection:${{ matrix.symfony }}" \
            "symfony/event-dispatcher:${{ matrix.symfony }}" \
            "symfony/http-foundation:${{ matrix.symfony }}" \
            "symfony/http-kernel:${{ matrix.symfony }}"
          composer require --dev --no-update \
            "symfony/framework-bundle:${{ matrix.symfony }}" \
            "symfony/yaml:${{ matrix.symfony }}" \
            "doctrine/dbal:${{ matrix.dbal }}"

      - name: Install Composer dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Show resolved versions
        run: |
          composer show symfony/http-kernel
          composer show doctrine/dbal
          composer show doctrine/doctrine-bundle
          composer show vulqen/php-sdk

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      - name: Run PHPStan
        run: composer phpstan
